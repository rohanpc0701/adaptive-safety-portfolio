name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/ -v

      - name: Synthetic bandit benchmark smoke
        run: python3 scripts/bandit_benchmark.py --synthetic

      - name: Synthetic PAIR attacker smoke
        run: python3 scripts/pair_attacker.py --synthetic

      - name: Disagreement sweep smoke
        run: python3 scripts/disagreement_sweep.py

      - name: Bootstrap CI smoke
        run: python3 scripts/bootstrap_ci_eval.py
