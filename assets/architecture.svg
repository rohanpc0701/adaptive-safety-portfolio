<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive safety cascade</title>
  <desc id="desc">A prompt passes through Prompt Guard, escalates to ShieldGemma and WildGuard when uncertain, and reaches an LLM judge only when those detectors disagree.</desc>
  <defs>
    <style>
      .title { fill: #f8fafc; font: 700 22px system-ui, sans-serif; }
      .label { fill: #f8fafc; font: 600 15px system-ui, sans-serif; }
      .detail { fill: #cbd5e1; font: 13px system-ui, sans-serif; }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2.5; marker-end: url(#arrow); }
      .box { fill: #172033; stroke: #64748b; stroke-width: 2; rx: 12; }
      .primary { stroke: #34d399; }
      .middle { stroke: #fbbf24; }
      .judge { stroke: #60a5fa; }
      .stop { stroke: #f87171; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="390" fill="#0f172a" rx="16"/>
  <text class="title" x="450" y="38" text-anchor="middle">Adaptive Safety Cascade</text>
  <text class="detail" x="450" y="61" text-anchor="middle">Run the cheapest detector first; escalate only when its decision needs more evidence.</text>

  <rect class="box" x="40" y="128" width="120" height="70"/>
  <text class="label" x="100" y="158" text-anchor="middle">Prompt</text>
  <text class="detail" x="100" y="180" text-anchor="middle">input</text>

  <rect class="box primary" x="220" y="110" width="190" height="106"/>
  <text class="label" x="315" y="148" text-anchor="middle">Prompt Guard 2</text>
  <text class="detail" x="315" y="171" text-anchor="middle">86M · every input</text>
  <text class="detail" x="315" y="193" text-anchor="middle">~94 ms in benchmark</text>

  <rect class="box middle" x="475" y="84" width="180" height="74"/>
  <text class="label" x="565" y="115" text-anchor="middle">ShieldGemma 2B</text>
  <text class="detail" x="565" y="137" text-anchor="middle">mid-tier detector</text>

  <rect class="box middle" x="475" y="190" width="180" height="74"/>
  <text class="label" x="565" y="221" text-anchor="middle">WildGuard 7B</text>
  <text class="detail" x="565" y="243" text-anchor="middle">mid-tier detector</text>

  <rect class="box judge" x="720" y="128" width="140" height="70"/>
  <text class="label" x="790" y="158" text-anchor="middle">LLM judge</text>
  <text class="detail" x="790" y="180" text-anchor="middle">disagreement only</text>

  <rect class="box stop" x="220" y="296" width="190" height="58"/>
  <text class="label" x="315" y="331" text-anchor="middle">Return decision</text>

  <path class="edge" d="M160 163 H220"/>
  <path class="edge" d="M410 142 H475"/>
  <path class="edge" d="M410 184 H475"/>
  <path class="edge" d="M655 121 C690 121 687 150 720 150"/>
  <path class="edge" d="M655 227 C690 227 687 177 720 177"/>
  <path class="edge" d="M315 216 V296"/>

  <text class="detail" x="443" y="111" text-anchor="middle">uncertain</text>
  <text class="detail" x="687" y="112" text-anchor="middle">disagree</text>
  <text class="detail" x="327" y="261">confident</text>
  <text class="detail" x="450" y="375" text-anchor="middle">Committed run: 18% stop after stage 1 · 60% after stage 2 · 22% reach the judge</text>
</svg>
